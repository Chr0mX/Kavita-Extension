<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#fff5fa" />
    <title>Kavita Extension</title>
    <link rel="icon" href="Kavita/static/icon.png" type="image/png" />
    <link
      rel="preload"
      href="fonts/quicksand-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a
      href="https://github.com/chr0mx/kavita-extension"
      id="github-link"
      target="_blank"
      rel="noopener"
      aria-label="GitHub Repository"
    >
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path
          d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.19 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"
        />
      </svg>
    </a>

    <header id="top">
      <img class="site-logo" src="Kavita/static/icon.png" alt="" width="96" height="96" />
      <span class="header-sparkle" aria-hidden="true">🌸 ✨ 🍡</span>
      <h1><span class="main-heading" id="repo-name">Kavita Extension</span></h1>
      <p class="main-description" id="repo-description"></p>
      <button type="button" class="repo-add repo-add-big" id="add-repo">Add to Paperback</button>
    </header>

    <main>
      <div class="note note-compat">
        <p>
          💡 <b>Requires Paperback 0.9.</b> Tap <b>Add to Paperback</b> on your iPhone or iPad, or
          copy this page's URL into <b>Settings → Extensions → Add Repository</b>.
        </p>
      </div>

      <p class="note" id="error" hidden></p>
      <ul class="source-list" id="sources" aria-live="polite"></ul>
    </main>

    <footer>
      <span class="footer-hearts" aria-hidden="true">💗 💜 💙</span>
      <span id="build-info"></span><br />
      <a href="../../">About this extension</a>
    </footer>

    <script src="repo.js"></script>
  </body>
</html>
